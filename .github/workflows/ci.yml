name: CI

on:
  push:
    branches: [main, 'rewrite/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true

      - name: Check (analyze, format, all tests)
        env:
          TAVLI_BENCH_SCALE: '3'
        run: tool/ci/check.sh
